<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation Example</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #title { color: blue; }
    .highlight { color: red; font-weight: bold; }
    button { margin: 5px; padding: 8px 12px; }
  </style>
</head>
<body>

  <h1 id="title">Hello, DOM!</h1>
  <p id="para">This is a simple paragraph.</p>
  <ul id="list">
    <li>Apple</li>
    <li>Banana</li>
  </ul>

  <button onclick="changeText()">Change Text</button>
  <button onclick="changeStyle()">Change Style</button>
  <button onclick="addItem()">Add Item</button>
  <button onclick="removeItem()">Remove Last Item</button>

  <script>
    // Change the text of an element
    function changeText() {
      document.getElementById("para").innerText = "The text has been changed!";
    }

    // Change the style of an element
    function changeStyle() {
      document.getElementById("title").classList.toggle("highlight");
    }

    // Add a new list item
    function addItem() {
      let newItem = document.createElement("li");
      newItem.innerText = "Mango";
      document.getElementById("list").appendChild(newItem);
    }

    // Remove the last list item
    function removeItem() {
      let list = document.getElementById("list");
      if (list.lastElementChild) {
        list.removeChild(list.lastElementChild);
      }
    }
  </script>

</body>
</html>
